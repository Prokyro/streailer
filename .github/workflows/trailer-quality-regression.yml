name: Trailer quality regression
on:
  push:
    branches: [feat/trailer-quality-preference]
  pull_request:
    branches: [fix/22-localized-trailer-selection]
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:regression

  docker-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build ARM64 image
        run: docker buildx build --platform linux/arm64 --progress plain .
